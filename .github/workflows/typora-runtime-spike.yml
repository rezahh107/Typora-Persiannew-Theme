name: Typora real-runtime feasibility spike (review-only)

on:
  push:
    branches:
      - spike/typora-real-runtime-20261024

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact spike commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Typora from official signed Ubuntu repository
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://downloads.typora.io/typora.gpg | sudo tee /etc/apt/keyrings/typora.gpg > /dev/null
          echo 'deb [signed-by=/etc/apt/keyrings/typora.gpg] https://downloads.typora.io/linux ./' | sudo tee /etc/apt/sources.list.d/typora.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq typora xvfb openbox xdotool wmctrl scrot fonts-noto-core
          dpkg-query -W typora
          sha256sum themes/persiannew/legacy/PersianNew2.css
      - name: Launch actual Typora without forbidden debug switches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/typora-spike"
          OUT="$RUNNER_TEMP/typora-spike"
          echo "Commit: $(git rev-parse HEAD)" | tee "$OUT/environment.txt"
          echo "OS: $(lsb_release -ds)" | tee -a "$OUT/environment.txt"
          dpkg-query -W typora | tee -a "$OUT/environment.txt"
          for family in Vazir Vazirmatn 'Amazon Ember Display'; do
            printf 'fc-match(%s): ' "$family" | tee -a "$OUT/environment.txt"
            fc-match -f '%{family}: %{file}\n' "$family" | tee -a "$OUT/environment.txt"
          done
          (fc-list -f '%{family}\n' | grep -Ei 'Vazir|Amazon Ember' | sort -u || true) > "$OUT/installed-target-fonts.txt"
          printf 'Fonts: ' >> "$OUT/environment.txt"
          fc-list -f '%{family}\n' | sort -u | grep -Ei 'Noto|Vazir|Ember|DejaVu' | head -25 >> "$OUT/environment.txt" || true
          export DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >"$OUT/xvfb.log" 2>&1 &
          sleep 2
          openbox >"$OUT/openbox.log" 2>&1 &
          sleep 2
          mkdir -p "$HOME/.config/Typora/themes"
          cp themes/persiannew/legacy/PersianNew2.css "$HOME/.config/Typora/themes/persiannew-legacy.css"
          cp themes/persiannew/persiannew.css "$HOME/.config/Typora/themes/persiannew-candidate.css"
          sha256sum "$HOME/.config/Typora/themes/"persiannew-*.css | tee -a "$OUT/environment.txt"
          echo "Opening $(realpath tests/fixtures/rtl-ltr.md)" | tee -a "$OUT/environment.txt"
          typora "$(realpath tests/fixtures/rtl-ltr.md)" --disable-gpu >"$OUT/typora.stdout.log" 2>&1 &
          APP_PID=$!
          echo "Typora launched with PID=$APP_PID" | tee -a "$OUT/environment.txt"
          sleep 12
          wmctrl -lxp | tee "$OUT/windows-12s.txt" || true
          xdotool search --onlyvisible --name '.' getwindowname >"$OUT/window-titles-12s.txt" 2>&1 || true
          scrot -z "$OUT/typora-12s.png"
          WID=$(wmctrl -lxp | awk '/typora.typora/ {print $1; exit}')
          if [ -n "$WID" ]; then
            wmctrl -ir "$WID" -e 0,50,40,1300,820
            xdotool windowactivate --sync "$WID"
            xdotool mousemove --sync 315 55 click 1
            sleep 1
            scrot -z "$OUT/themes-menu.png"
            # Native menu rows observed on identical fixed-size X11 window.
            xdotool mousemove --sync 397 182 click 1
            sleep 6
            scrot -z "$OUT/candidate-rtl-6s.png"
            sleep 12
            scrot -z "$OUT/candidate-rtl-18s.png"
            xdotool mousemove --sync 315 55 click 1
            sleep 1
            scrot -z "$OUT/candidate-selected-menu.png"
            xdotool mousemove --sync 397 215 click 1
            sleep 6
            scrot -z "$OUT/legacy-rtl-6s.png"
            sleep 12
            scrot -z "$OUT/legacy-rtl-18s.png"
            xdotool mousemove --sync 315 55 click 1
            sleep 1
            scrot -z "$OUT/legacy-selected-menu.png"
            xdotool key Escape
          fi
          # Probe second fixture under legacy then candidate in same process.
          typora "$(realpath tests/fixtures/code-fences.md)" --disable-gpu >"$OUT/open-code-fences.log" 2>&1 &
          sleep 8
          wmctrl -lxp | tee "$OUT/windows-code.txt" || true
          CWID=$(wmctrl -lxp | awk '/code-fences.md/ {print $1; exit}')
          if [ -n "$CWID" ]; then
            wmctrl -ir "$CWID" -e 0,50,40,1300,820
            xdotool windowactivate --sync "$CWID"
            sleep 1
            scrot -z "$OUT/legacy-code-early.png"
            sleep 12
            scrot -z "$OUT/legacy-code-late.png"
            xdotool mousemove --sync 260 378 click 1
            sleep 1
            scrot -z "$OUT/legacy-code-focus-1s.png"
            sleep 12
            scrot -z "$OUT/legacy-code-focus-13s.png"
            xdotool mousemove --sync 315 55 click 1
            sleep 1
            scrot -z "$OUT/code-menu-before-candidate.png"
            xdotool mousemove --sync 397 182 click 1
            sleep 6
            scrot -z "$OUT/candidate-code-early.png"
            sleep 12
            scrot -z "$OUT/candidate-code-late.png"
            xdotool mousemove --sync 260 378 click 1
            sleep 1
            scrot -z "$OUT/candidate-code-focus-1s.png"
            sleep 12
            scrot -z "$OUT/candidate-code-focus-13s.png"
            xdotool mousemove --sync 315 55 click 1
            sleep 1
            scrot -z "$OUT/code-candidate-selected-menu.png"
            xdotool key Escape
          else
            echo 'No code-fences.md window: code-fence comparison NOT_PROVEN' | tee -a "$OUT/environment.txt"
          fi
          for pair in 'candidate-rtl-6s legacy-rtl-6s' 'candidate-rtl-18s legacy-rtl-18s' 'candidate-code-early legacy-code-early' 'candidate-code-late legacy-code-late'; do
            read -r first second <<< "$pair"
            if cmp -s "$OUT/$first.png" "$OUT/$second.png"; then
              echo "IDENTICAL_PNG: $first vs $second" | tee -a "$OUT/comparison.txt"
            else
              echo "DIFFERENT_PNG: $first vs $second" | tee -a "$OUT/comparison.txt"
            fi
          done
          sleep 2
          wmctrl -lxp | tee "$OUT/windows-30s.txt" || true
          scrot -z "$OUT/typora-30s.png"
          echo "PROCESS:" | tee -a "$OUT/environment.txt"
          ps -p "$APP_PID" -o pid,comm,stat= | tee -a "$OUT/environment.txt" || true
          echo "Window titles:" && cat "$OUT/window-titles-12s.txt" || true
          if [ ! -s "$OUT/windows-30s.txt" ]; then
            echo "No X11 window visible; Typora GUI proof fails."
            exit 1
          fi
      - name: Upload raw observation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typora-real-runtime-spike
          path: ${{ runner.temp }}/typora-spike/
          if-no-files-found: warn
          retention-days: 7
